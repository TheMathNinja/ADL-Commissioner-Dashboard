name: Guardian backup scheduling gate
on:
  schedule:
    - cron: '2-59/5 * * 9-12,1 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Assess eligibility without requesting private jobs
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: guardian-public-scheduling-gate
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Test backup dispatch and off-hours suppression
        run: python3 -m unittest discover -s tests -p test_guardian_fallback.py -v
      - name: Request only required private Guardian work
        env:
          PRIVATE_REPORT_TOKEN: ${{ secrets.WEEKLY_ORCHESTRATION_TOKEN }}
          DISPATCH_OWNER: ${{ vars.GUARDIAN_NATIVE_FALLBACK }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DISPATCH_OWNER" = public-scheduler-v1 ] && [ "$DRY_RUN" != true ]; then args+=(--live); fi
          python3 scripts/guardian_fallback.py "${args[@]}"
