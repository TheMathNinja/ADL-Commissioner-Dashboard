name: Test MFL Salary No-Op Write

on:
  workflow_dispatch:
    inputs:
      season:
        description: "MFL season to test. Leave blank for current year."
        required: false
        default: ""
      player_id:
        description: "Optional MFL player id to no-op write. Leave blank to choose the first salary-bearing roster row."
        required: false
        default: ""
      franchise_id:
        description: "Optional franchise id to pair with player_id."
        required: false
        default: ""

permissions:
  contents: read

env:
  R_LIBS_USER: ${{ github.workspace }}/_lib
  CURRENT_SEASON: ${{ inputs.season }}
  ADL_MFL_NOOP_PLAYER_ID: ${{ inputs.player_id }}
  ADL_MFL_NOOP_FRANCHISE_ID: ${{ inputs.franchise_id }}

jobs:
  noop-write:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up cached ADL R runtime
        uses: ./.github/actions/setup-adl-r

      - name: Run no-op salary write test
        env:
          ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}
        run: Rscript scripts/test_mfl_salary_noop_write.R

      - name: Upload no-op test audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfl-salary-noop-write-test-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: data/salary_snapshots/mfl_salary_noop_write_test_*.csv
