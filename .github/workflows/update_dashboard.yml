name: Update Dashboard

on:
  workflow_dispatch:
    inputs:
      enable_mfl_salary_writes:
        description: "Enable live MFL salary writes for this manual run. Use only for controlled testing."
        required: false
        default: false
        type: boolean
      mfl_salary_write_import_type:
        description: "Optional override for the MFL import TYPE used for salary writes."
        required: false
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'data/**'
  schedule:
    - cron: "17 9 * * *"
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: commissioner-dashboard-data-writes
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    env:
      RAW_CACHE_DIR: cache/raw_league_data
      RAW_CACHE_VERSION: v1
      R_LIBS_USER: ${{ github.workspace }}/_lib
      ADL_DASHBOARD_RUN_TYPE: ${{ github.event_name }}
      ADL_SALADJ_SEND_EMAIL: true
      ADL_ALERT_RECIPIENT_FRANCHISES: CHI,KCC,IND,SEA
      ADL_ALERT_DIGEST_FRANCHISES: CHI,KCC,IND,SEA
      ADL_ALERT_DIGEST_EXTRA_EMAILS: ${{ secrets.ADL_ALERT_DIGEST_EXTRA_EMAILS }}
      ADL_ALERT_NFC_CC: ${{ secrets.ADL_ALERT_NFC_CC }}
      ADL_ALERT_AFC_CC: ${{ secrets.ADL_ALERT_AFC_CC }}
      ADL_ALERT_EMAIL_FROM: ${{ secrets.ADL_ALERT_EMAIL_FROM }}
      ADL_ALERT_EMAIL_TO: ${{ secrets.ADL_ALERT_EMAIL_TO }}
      ADL_SMTP_SERVER: ${{ secrets.ADL_SMTP_SERVER }}
      ADL_SMTP_USERNAME: ${{ secrets.ADL_SMTP_USERNAME }}
      ADL_SMTP_PASSWORD: ${{ secrets.ADL_SMTP_PASSWORD }}
      ADL_SMTP_SSL: ${{ secrets.ADL_SMTP_SSL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether scheduled run should proceed
        id: localtime
        shell: bash
        run: |
          LOCAL_DATE=$(TZ=America/Toronto date +%F)
          LOCAL_MONTH_DAY=$(TZ=America/Toronto date +%m-%d)
          CURRENT_SEASON=${LOCAL_DATE%%-*}
          echo "local_date=${LOCAL_DATE}" >> "$GITHUB_OUTPUT"
          echo "current_season=${CURRENT_SEASON}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enable_mfl_salary_writes }}" = "true" ]; then
              echo "enable_mfl_salary_writes=true" >> "$GITHUB_OUTPUT"
            else
              echo "enable_mfl_salary_writes=false" >> "$GITHUB_OUTPUT"
            fi
            echo "Push/manual run -> proceeding."
            exit 0
          fi

          TORONTO_OFFSET=$(TZ=America/Toronto date +%z)
          SCHEDULE="${{ github.event.schedule }}"
          echo "Toronto UTC offset is $TORONTO_OFFSET"
          echo "Scheduled cron is $SCHEDULE"

          if { [ "$TORONTO_OFFSET" = "-0400" ] && [ "$SCHEDULE" = "17 9 * * *" ]; } || \
             { [ "$TORONTO_OFFSET" = "-0500" ] && [ "$SCHEDULE" = "17 10 * * *" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Correct 5 a.m. Toronto cron slot -> proceeding."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "enable_mfl_salary_writes=false" >> "$GITHUB_OUTPUT"
            echo "Duplicate non-5 a.m. Toronto cron slot -> skipping."
            exit 0
          fi

          if [ "${LOCAL_MONTH_DAY}" = "07-01" ] && [ "${CURRENT_SEASON}" -ge 2027 ]; then
            echo "enable_mfl_salary_writes=true" >> "$GITHUB_OUTPUT"
            echo "July 1 salary write window open for ${CURRENT_SEASON}."
          else
            echo "enable_mfl_salary_writes=false" >> "$GITHUB_OUTPUT"
            echo "MFL salary writes disabled outside July 1 season 2027+ window."
          fi

      - name: Create cache directories
        if: steps.localtime.outputs.should_run == 'true'
        run: |
          mkdir -p "${RAW_CACHE_DIR}"
          mkdir -p "${R_LIBS_USER}"
          mkdir -p data
          mkdir -p docs

      - name: Restore raw league data cache
        if: steps.localtime.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.RAW_CACHE_DIR }}
          key: ${{ runner.os }}-raw-league-data-${{ env.RAW_CACHE_VERSION }}-${{ hashFiles('scripts/**/*.R', 'R/**/*.R') }}
          restore-keys: |
            ${{ runner.os }}-raw-league-data-${{ env.RAW_CACHE_VERSION }}-

      - name: Restore R package library cache
        if: steps.localtime.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-lib-v2-${{ hashFiles('.github/workflows/update_dashboard.yml') }}
          restore-keys: |
            ${{ runner.os }}-r-lib-v2-

      - name: Install Ubuntu system libraries
        if: steps.localtime.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtiff5-dev \
            libxml2-dev \
            libuv1-dev \
            pkg-config

      - name: Set up R
        if: steps.localtime.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install and verify R packages
        if: steps.localtime.outputs.should_run == 'true'
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          .libPaths(Sys.getenv("R_LIBS_USER"))

          packages <- c("curl", "dplyr", "ffscrapr", "httr", "jsonlite", "lubridate", "nflreadr", "purrr", "readr", "stringr", "tibble")
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]

          if (length(missing) > 0) {
            install.packages(
              missing,
              repos = "https://cloud.r-project.org",
              dependencies = c("Depends", "Imports", "LinkingTo"),
              Ncpus = max(1, parallel::detectCores() - 1)
            )
          }

          still_missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(still_missing) > 0) {
            stop("R packages still not installed: ", paste(still_missing, collapse = ", "))
          }

          invisible(lapply(packages, requireNamespace, quietly = TRUE))
          sessionInfo()

      - name: Run SalAdjCurator script
        if: steps.localtime.outputs.should_run == 'true'
        env:
          CURRENT_SEASON: ${{ steps.localtime.outputs.current_season }}
          RAW_CACHE_DIR: ${{ env.RAW_CACHE_DIR }}
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
          ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}
        run: Rscript scripts/run_saladjcurator.R

      - name: Build official July 1 salary snapshot
        if: steps.localtime.outputs.should_run == 'true'
        env:
          CURRENT_SEASON: ${{ steps.localtime.outputs.current_season }}
          RAW_CACHE_DIR: ${{ env.RAW_CACHE_DIR }}
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
          ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}
          ADL_ENABLE_MFL_SALARY_WRITES: ${{ steps.localtime.outputs.enable_mfl_salary_writes }}
          ADL_MFL_SALARY_WRITE_IMPORT_TYPE: ${{ inputs.mfl_salary_write_import_type || secrets.ADL_MFL_SALARY_WRITE_IMPORT_TYPE }}
        run: Rscript scripts/build_official_july1_snapshot.R

      - name: Build dashboard site
        if: steps.localtime.outputs.should_run == 'true'
        env:
          CURRENT_SEASON: ${{ steps.localtime.outputs.current_season }}
          RAW_CACHE_DIR: ${{ env.RAW_CACHE_DIR }}
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
        run: Rscript scripts/build_dashboard.R

      - name: Commit generated files
        if: steps.localtime.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Automated dashboard update"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          echo "Failed to push dashboard update after 3 attempts."
          exit 1

      - name: Upload SalAdj recovery outputs
        if: failure() && steps.localtime.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: saladj-recovery-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            data/SalAdjCurator_${{ steps.localtime.outputs.current_season }}.csv
            data/SalAdjCurator_${{ steps.localtime.outputs.current_season }}.rds
            data/SalAdjCurator_latest.csv
            data/saladj_qualified_${{ steps.localtime.outputs.current_season }}.rds
            data/run_metadata.csv
            data/saladj_email_status.csv
            data/archive/*ADLSalAdjCurator*
            data/roster_snapshots/saladj_roster_snapshot_${{ steps.localtime.outputs.current_season }}*.csv
            data/salary_snapshots/july1_*_${{ steps.localtime.outputs.current_season }}.csv
            data/commissioner_alerts/email_outbox_july1_eft_mfl_salary_writes_${{ steps.localtime.outputs.current_season }}.txt

