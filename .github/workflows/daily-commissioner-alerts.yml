on:
  workflow_call:
    inputs:
      cutdown_id:
        required: false
        default: ""
        type: string
      send_email:
        required: false
        default: "true"
        type: string
      checked_at:
        required: false
        default: ""
        type: string
      orchestrator_run_id:
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      cutdown_id:
        description: Optional roster cutdown benchmark to run instead of the regular daily check.
        required: false
        type: string
      send_email:
        description: Send alert emails during this manual run.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      checked_at:
        description: Optional America/New_York timestamp for dry-run testing, e.g. 2026-09-13 06:15:00.
        required: false
        type: string
      orchestrator_run_id:
        description: Calling maintenance run ID used to correlate this run.
        required: false
        default: ""
        type: string

name: daily-commissioner-alerts
run-name: ${{ inputs.orchestrator_run_id != '' && format('Daily maintenance {0} - Commissioner alerts', inputs.orchestrator_run_id) || 'daily-commissioner-alerts' }}

permissions:
  contents: write

concurrency:
  group: commissioner-dashboard-data-writes
  cancel-in-progress: false

jobs:
  daily-commissioner-alerts:
    runs-on: ubuntu-latest
    env:
      CURRENT_SEASON: 2026
      ADL_RAW_LEAGUE_DATA_DIR: cache/raw_league_data
      ADL_CAP_ACCOUNTING_DIR: data/cap_accounting
      R_LIBS_USER: ${{ github.workspace }}/_lib
      ADL_ALERT_MODE: check
      ADL_ALERT_FORCE_LIVE: true
      ADL_ALERT_CHECKED_AT: ${{ inputs.checked_at }}
      ADL_ALERT_RECIPIENT_FRANCHISES: CHI,KCC,IND,SEA
      ADL_ALERT_DIGEST_FRANCHISES: CHI,KCC,IND,SEA
      ADL_ALERT_DIGEST_EXTRA_EMAILS: ${{ secrets.ADL_ALERT_DIGEST_EXTRA_EMAILS }}
      ADL_ALERT_NFC_CC: ${{ secrets.ADL_ALERT_NFC_CC }}
      ADL_ALERT_AFC_CC: ${{ secrets.ADL_ALERT_AFC_CC }}
      ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
      MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
      MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
      MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}
      ADL_ALERT_EMAIL_FROM: ${{ secrets.ADL_ALERT_EMAIL_FROM }}
      ADL_ALERT_EMAIL_TO: ${{ secrets.ADL_ALERT_EMAIL_TO }}
      ADL_SMTP_SERVER: ${{ secrets.ADL_SMTP_SERVER }}
      ADL_SMTP_USERNAME: ${{ secrets.ADL_SMTP_USERNAME }}
      ADL_SMTP_PASSWORD: ${{ secrets.ADL_SMTP_PASSWORD }}
      ADL_SMTP_SSL: ${{ secrets.ADL_SMTP_SSL }}

    steps:
      - name: Checkout dashboard repo
        uses: actions/checkout@v4
        with:
          repository: TheMathNinja/ADL-Commissioner-Dashboard
          token: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN || github.token }}

      - name: Create cache directories
        run: |
          mkdir -p "${ADL_RAW_LEAGUE_DATA_DIR}"
          mkdir -p "${R_LIBS_USER}"
          mkdir -p data

      - name: Restore raw league data cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ADL_RAW_LEAGUE_DATA_DIR }}
          key: ${{ runner.os }}-commissioner-raw-league-data-${{ env.CURRENT_SEASON }}-${{ hashFiles('scripts/**/*.R', 'R/**/*.R') }}
          restore-keys: |
            ${{ runner.os }}-commissioner-raw-league-data-${{ env.CURRENT_SEASON }}-

      - name: Set up cached ADL R runtime
        uses: ./.github/actions/setup-adl-r

      - name: Run commissioner alerts
        run: |
          CUTDOWN_ID="${{ inputs.cutdown_id }}"
          SEND_EMAIL="${{ inputs.send_email }}"
          if [ -z "${SEND_EMAIL}" ]; then
            SEND_EMAIL="true"
          fi
          EMAIL_ARGS=""
          if [ "${SEND_EMAIL}" = "true" ]; then
            EMAIL_ARGS="--send-email"
          fi
          export ADL_ALERT_SEND_EMAIL="${SEND_EMAIL}"

          if [ -n "${CUTDOWN_ID}" ]; then
            Rscript scripts/run_commissioner_alerts.R --mode=cutdown --cutdown="${CUTDOWN_ID}" --season=${CURRENT_SEASON} --force-live ${EMAIL_ARGS} --send-empty --skip-completed-cutdown
          else
            Rscript scripts/run_commissioner_alerts.R --mode=check --season=${CURRENT_SEASON} --force-live ${EMAIL_ARGS}
          fi

      - name: Build dashboard site
        if: always()
        run: Rscript scripts/build_dashboard.R

      - name: Commit public violation reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/commissioner_alert_reports data/inseason_inactivity docs
          git diff --cached --quiet && exit 0
          git commit -m "Automated commissioner alert report"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          echo "Failed to push commissioner alert report after 3 attempts."
          exit 1

      - name: Upload alert results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: commissioner-alert-results
          path: |
            data/commissioner_alerts/
            data/inseason_inactivity/
