name: Provision private notification credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Transfer existing mail credentials through encrypted repository secrets
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
          ADL_ALERT_EMAIL_FROM: ${{ secrets.ADL_ALERT_EMAIL_FROM }}
          ADL_SMTP_SERVER: ${{ secrets.ADL_SMTP_SERVER }}
          ADL_SMTP_USERNAME: ${{ secrets.ADL_SMTP_USERNAME }}
          ADL_SMTP_PASSWORD: ${{ secrets.ADL_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ADL_ALERT_EMAIL_FROM ADL_SMTP_SERVER ADL_SMTP_USERNAME ADL_SMTP_PASSWORD; do
            test -n "${!name}"
            printf '%s' "${!name}" | gh secret set "$name" --repo TheMathNinja/Chicago-Bears-Lineup-Guardian
          done
