name: ADL Automation Preflight

on:
  workflow_dispatch:
    inputs:
      run_live_mfl_checks:
        description: Run all live MFL checks unless individual live-check inputs below are set.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_commissioner_alerts:
        description: Run the no-email commissioner alert smoke check.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_salary_cap:
        description: Run the salary cap accounting smoke check.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_saladj_reconciliation:
        description: Compare MFL visible salary adjustments against SalAdj Curator.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_saladj_curator:
        description: Run the no-email SalAdj Curator smoke check.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      fail_on_saladj_mismatch:
        description: Fail the preflight if MFL and SalAdj Curator totals do not match.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      snapshot_week:
        description: Salary accounting week for the smoke run.
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CURRENT_SEASON: "2026"
      ADL_WEEK_ONE_START: "2026-09-10"
      SNAPSHOT_WEEK: ${{ github.event.inputs.snapshot_week }}
      ADL_RAW_LEAGUE_DATA_DIR: cache/raw_league_data
      RAW_CACHE_DIR: cache/raw_league_data
      ADL_CAP_ACCOUNTING_DIR: data/cap_accounting
      R_LIBS_USER: ${{ github.workspace }}/_lib
      ADL_ALERT_FORCE_LIVE: true
      ADL_ALERT_SEND_EMAIL: false
      ADL_SALADJ_SEND_EMAIL: false
      ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
      MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
      MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
      MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      CONTRACT_ADMIN_SHEET_ID: 1Pyw8qVfiBlXNuX0lW0LdjRnBiijfbo2BXHfZMWwLLaw

    steps:
      - name: Checkout dashboard repo
        uses: actions/checkout@v4

      - name: Create cache directories
        run: |
          mkdir -p "${ADL_RAW_LEAGUE_DATA_DIR}"
          mkdir -p "${R_LIBS_USER}"
          mkdir -p data
          mkdir -p docs

      - name: Set up cached ADL R runtime
        uses: ./.github/actions/setup-adl-r

      - name: Parse all R scripts
        shell: Rscript {0}
        run: |
          .libPaths(Sys.getenv("R_LIBS_USER"))
          r_files <- list.files(c("R", "scripts"), pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
          invisible(lapply(r_files, parse))
          cat("Parsed", length(r_files), "R files.\n")

      - name: Verify cap workflow transaction safety
        run: python3 scripts/check_cap_workflow_safety.py

      - name: Verify SalAdj individual waiver event matching
        run: Rscript scripts/test_saladj_waivers.R

      - name: Verify SalAdj drop transaction types
        run: Rscript scripts/test_saladj_transaction_types.R

      - name: Verify SalAdj email template
        run: Rscript scripts/test_saladj_email.R

      - name: Verify roster-cap streak and inactivity labels
        run: Rscript scripts/test_roster_cap_streaks.R

      - name: Verify cap snapshot confirmation email
        run: Rscript scripts/test_cap_snapshot_confirmation.R

      - name: Run commissioner alerts no-email smoke check
        if: ${{ github.event.inputs.run_live_mfl_checks == 'true' && github.event.inputs.run_commissioner_alerts == 'true' }}
        run: |
          Rscript scripts/run_commissioner_alerts.R --mode=check --season=${CURRENT_SEASON} --force-live

      - name: Run salary cap accounting smoke check
        if: ${{ github.event.inputs.run_live_mfl_checks == 'true' && github.event.inputs.run_salary_cap == 'true' }}
        run: |
          Rscript scripts/run_cap_accounting.R

      - name: Run SalAdj Curator no-email smoke check
        if: ${{ github.event.inputs.run_live_mfl_checks == 'true' && github.event.inputs.run_saladj_curator == 'true' }}
        run: |
          Rscript scripts/audit_recent_mfl_transactions.R
          Rscript scripts/run_saladjcurator.R

      - name: Reconcile MFL salary adjustments against SalAdj Curator
        if: ${{ github.event.inputs.run_live_mfl_checks == 'true' && github.event.inputs.run_saladj_reconciliation == 'true' }}
        run: |
          FAIL_ARG=""
          if [ "${{ github.event.inputs.fail_on_saladj_mismatch }}" = "true" ]; then
            FAIL_ARG="--fail-on-mismatch"
          fi
          Rscript scripts/check_saladj_reconciliation.R --season=${CURRENT_SEASON} ${FAIL_ARG}

      - name: Upload SalAdj reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saladj-reconciliation
          path: |
            data/saladj_reconciliation.csv
            data/commissioner_error_checker.csv
            data/SalAdjCurator_latest.csv
            data/SalAdjCurator_2026.csv
            data/saladj_transaction_audit.csv
            data/archive/*_ADLSalAdjCurator.csv
            data/waiver_snapshots/

      - name: Build dashboard smoke check
        run: |
          Rscript scripts/build_dashboard.R
