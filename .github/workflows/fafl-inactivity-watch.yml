name: FAFL Inactivity Watch
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Inspect live source coverage without email or state changes
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: fafl-inactivity-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Inspect authenticated FAFL source coverage without writes
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
        run: python3 scripts/fafl_inactivity.py --probe
