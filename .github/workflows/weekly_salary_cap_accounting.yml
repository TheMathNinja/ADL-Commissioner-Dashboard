name: Weekly Salary Cap Accounting
run-name: ${{ inputs.orchestrator_run_id != '' && format('Official Week {0} cap snapshot (weekly package {1})', inputs.snapshot_week, inputs.orchestrator_run_id) || format('Official Week {0} cap snapshot', inputs.snapshot_week) }}

on:
  workflow_dispatch:
    inputs:
      snapshot_week:
        description: "Fantasy week to snapshot."
        required: true
        type: string
      orchestrator_run_id:
        description: "GM Dashboard weekly-package run that requested this snapshot."
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: commissioner-dashboard-data-writes
  cancel-in-progress: false

jobs:
  run-salary-cap-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CURRENT_SEASON: "2026"
      ADL_WEEK_ONE_START: "2026-09-10"
      SNAPSHOT_WEEK: ${{ github.event.inputs.snapshot_week }}
      RAW_CACHE_DIR: cache/raw_league_data
      R_LIBS_USER: ${{ github.workspace }}/_lib
      GOOGLE_SERVICE_ACCOUNT_JSON_PRESENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify cap workflow transaction safety
        run: python3 scripts/check_cap_workflow_safety.py

      - name: Verify snapshot request
        id: localtime
        shell: bash
        run: |
          test -n "$SNAPSHOT_WEEK" || { echo "snapshot_week is required"; exit 1; }
          [[ "$SNAPSHOT_WEEK" =~ ^[0-9]+$ ]] || { echo "snapshot_week must be numeric"; exit 1; }
          metadata_path="data/cap_accounting/${CURRENT_SEASON}/${CURRENT_SEASON}w${SNAPSHOT_WEEK}_ADLsalarycapmetadata.csv"
          completion_path="data/cap_accounting/${CURRENT_SEASON}/${CURRENT_SEASON}w${SNAPSHOT_WEEK}_ADLsalarycapcomplete.csv"
          if [ -f "$completion_path" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "capture_needed=false" >> "$GITHUB_OUTPUT"
            echo "The official Week ${SNAPSHOT_WEEK} cap package is already complete; preserving it."
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          if [ -f "$metadata_path" ]; then
            echo "capture_needed=false" >> "$GITHUB_OUTPUT"
            echo "Week ${SNAPSHOT_WEEK} snapshot is already committed; resuming its unfinished Cap Rollover writeback."
          else
            echo "capture_needed=true" >> "$GITHUB_OUTPUT"
            echo "Weekly package requested the official Week ${SNAPSHOT_WEEK} cap snapshot."
          fi

      - name: Create cache directories
        if: steps.localtime.outputs.should_run == 'true'
        run: |
          mkdir -p "${RAW_CACHE_DIR}"
          mkdir -p "${R_LIBS_USER}"
          mkdir -p data
          mkdir -p docs

      - name: Set up cached ADL R runtime
        if: steps.localtime.outputs.should_run == 'true'
        uses: ./.github/actions/setup-adl-r

      - name: Run salary cap accounting
        if: steps.localtime.outputs.capture_needed == 'true'
        env:
          CURRENT_SEASON: ${{ env.CURRENT_SEASON }}
          SNAPSHOT_WEEK: ${{ env.SNAPSHOT_WEEK }}
          RAW_CACHE_DIR: ${{ env.RAW_CACHE_DIR }}
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
          ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}
        run: |
          for attempt in 1 2 3; do
            Rscript scripts/run_cap_accounting.R && exit 0
            echo "Salary cap accounting attempt ${attempt} failed."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Build dashboard site
        if: steps.localtime.outputs.capture_needed == 'true'
        env:
          CURRENT_SEASON: ${{ env.CURRENT_SEASON }}
          RAW_CACHE_DIR: ${{ env.RAW_CACHE_DIR }}
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
        run: Rscript scripts/build_dashboard.R

      - name: Commit immutable snapshot files
        if: steps.localtime.outputs.capture_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && { echo "No snapshot files were generated."; exit 1; }
          git commit -m "Update weekly salary cap accounting"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          echo "Failed to push weekly salary cap accounting after 3 attempts."
          exit 1

      - name: Update Contract Admin Cap Rollover tab
        if: steps.localtime.outputs.should_run == 'true' && env.GOOGLE_SERVICE_ACCOUNT_JSON_PRESENT == 'true'
        env:
          CURRENT_SEASON: ${{ env.CURRENT_SEASON }}
          SNAPSHOT_WEEK: ${{ env.SNAPSHOT_WEEK }}
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
          CONTRACT_ADMIN_SHEET_ID: 1Pyw8qVfiBlXNuX0lW0LdjRnBiijfbo2BXHfZMWwLLaw
          CONTRACT_ADMIN_CAP_ROLLOVER_TAB: Cap Rollover
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          for attempt in 1 2 3; do
            Rscript scripts/push_cap_rollover_to_google_sheet.R && exit 0
            echo "Cap Rollover writeback attempt ${attempt} failed."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Skip Contract Admin writeback when Google credentials are missing
        if: steps.localtime.outputs.should_run == 'true' && env.GOOGLE_SERVICE_ACCOUNT_JSON_PRESENT != 'true'
        run: |
          echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON is not configured, so Cap Rollover cannot be certified complete."
          exit 1

      - name: Record completed cap package
        if: steps.localtime.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          completion_path="data/cap_accounting/${CURRENT_SEASON}/${CURRENT_SEASON}w${SNAPSHOT_WEEK}_ADLsalarycapcomplete.csv"
          mkdir -p "$(dirname "$completion_path")"
          printf 'season,week,completed_at_utc,orchestrator_run_id,workflow_run_url\n%s,%s,%s,%s,%s\n' \
            "$CURRENT_SEASON" "$SNAPSHOT_WEEK" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ inputs.orchestrator_run_id }}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "$completion_path"
          git add "$completion_path"
          git commit -m "Confirm Week ${SNAPSHOT_WEEK} cap package completion"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          echo "Failed to record completed cap package after 3 attempts."
          exit 1

      - name: Email official snapshot confirmation
        if: steps.localtime.outputs.should_run == 'true'
        continue-on-error: true
        env:
          CURRENT_SEASON: ${{ env.CURRENT_SEASON }}
          SNAPSHOT_WEEK: ${{ env.SNAPSHOT_WEEK }}
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
          ADL_CAP_SNAPSHOT_SEND_EMAIL: "true"
          ADL_CAP_SNAPSHOT_EMAIL_TO: fili.mikey@gmail.com,wittecarson@gmail.com
          ADL_CAP_SNAPSHOT_SHEET_STATUS: updated successfully
          ADL_ALERT_EMAIL_FROM: ${{ secrets.ADL_ALERT_EMAIL_FROM }}
          ADL_SMTP_SERVER: ${{ secrets.ADL_SMTP_SERVER }}
          ADL_SMTP_USERNAME: ${{ secrets.ADL_SMTP_USERNAME }}
          ADL_SMTP_PASSWORD: ${{ secrets.ADL_SMTP_PASSWORD }}
          ADL_SMTP_SSL: ${{ secrets.ADL_SMTP_SSL }}
        run: |
          for attempt in 1 2 3; do
            Rscript scripts/send_cap_snapshot_confirmation.R && exit 0
            echo "Snapshot confirmation email attempt ${attempt} failed."
            sleep $((attempt * 15))
          done
          echo "::warning::The cap package completed, but its confirmation email could not be sent."
          exit 1
