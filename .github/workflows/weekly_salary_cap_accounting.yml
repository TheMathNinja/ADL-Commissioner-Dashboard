name: Weekly Salary Cap Accounting

on:
  workflow_dispatch:
    inputs:
      snapshot_week:
        description: "Fantasy week to snapshot. Leave blank to infer from the NFL schedule."
        required: false
        type: string
  schedule:
    - cron: "15 3 * 9-12,1 2"
    - cron: "45 3 * 9-12,1 2"
    - cron: "15 4 * 9-12,1 2"
    - cron: "45 4 * 9-12,1 2"

permissions:
  contents: write
  actions: read

concurrency:
  group: commissioner-dashboard-data-writes
  cancel-in-progress: false

jobs:
  run-salary-cap-accounting:
    runs-on: ubuntu-latest

    env:
      CURRENT_SEASON: "2026"
      ADL_WEEK_ONE_START: "2026-09-10"
      SNAPSHOT_WEEK: ${{ github.event.inputs.snapshot_week }}
      RAW_CACHE_DIR: cache/raw_league_data
      R_LIBS_USER: ${{ github.workspace }}/_lib
      GOOGLE_SERVICE_ACCOUNT_JSON_PRESENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether scheduled run should proceed
        id: localtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run -> proceeding."
            exit 0
          fi

          TORONTO_OFFSET=$(TZ=America/Toronto date +%z)
          SCHEDULE="${{ github.event.schedule }}"
          echo "Toronto UTC offset is $TORONTO_OFFSET"
          echo "Scheduled cron is $SCHEDULE"

          PRIMARY_CRON=""
          BACKUP_CRON=""
          if [ "$TORONTO_OFFSET" = "-0400" ]; then
            PRIMARY_CRON="15 3 * 9-12,1 2"
            BACKUP_CRON="45 3 * 9-12,1 2"
          elif [ "$TORONTO_OFFSET" = "-0500" ]; then
            PRIMARY_CRON="15 4 * 9-12,1 2"
            BACKUP_CRON="45 4 * 9-12,1 2"
          fi

          if [ "$SCHEDULE" = "$PRIMARY_CRON" ] || [ "$SCHEDULE" = "$BACKUP_CRON" ]; then
            TODAY_ET=$(TZ=America/Toronto date +%F)
            DOW_ET=$(TZ=America/Toronto date +%u)
            SNAPSHOT_DATE_ET="$TODAY_ET"
            if [ "$DOW_ET" = "2" ]; then
              SNAPSHOT_DATE_ET=$(TZ=America/Toronto date -d "yesterday" +%F)
            fi
            FIRST_SNAPSHOT_DATE=$(TZ=America/Toronto date -d "${ADL_WEEK_ONE_START} +4 days" +%F)
            if [[ "$TODAY_ET" < "$FIRST_SNAPSHOT_DATE" ]]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Too early for weekly salary cap accounting. First official snapshot date is ${FIRST_SNAPSHOT_DATE}; today is ${TODAY_ET}."
            else
              CUTOFF_UTC=$(TZ=America/Toronto date -u -d "${SNAPSHOT_DATE_ET} 23:00" +%Y-%m-%dT%H:%M:%SZ)
              echo "Snapshot date is ${SNAPSHOT_DATE_ET}; checking for a successful salary snapshot run since ${CUTOFF_UTC}."
              RECENT_SUCCESS_COUNT=$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow weekly_salary_cap_accounting.yml \
                --branch main \
                --status success \
                --limit 20 \
                --json createdAt,event,databaseId \
                --jq "[.[] | select(.createdAt >= \"${CUTOFF_UTC}\" and (.databaseId|tostring) != \"${GITHUB_RUN_ID}\" and (.event == \"schedule\" or .event == \"workflow_dispatch\"))] | length")

              if [ "${RECENT_SUCCESS_COUNT}" -gt 0 ]; then
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                echo "A successful salary snapshot run already completed for this Monday-night window -> scheduled run skipping."
              elif [ "$SCHEDULE" = "$BACKUP_CRON" ]; then
                echo "should_run=true" >> "$GITHUB_OUTPUT"
                echo "No successful primary scheduled salary snapshot found tonight -> backup proceeding."
              else
                echo "should_run=true" >> "$GITHUB_OUTPUT"
                echo "Primary 11:15 p.m. Toronto Monday cron slot -> proceeding."
              fi
            fi
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Duplicate non-Monday-night Toronto cron slot -> skipping."
          fi

      - name: Create cache directories
        if: steps.localtime.outputs.should_run == 'true'
        run: |
          mkdir -p "${RAW_CACHE_DIR}"
          mkdir -p "${R_LIBS_USER}"
          mkdir -p data
          mkdir -p docs

      - name: Restore R package library cache
        if: steps.localtime.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-lib-v2-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-r-lib-v2-

      - name: Install Ubuntu system libraries
        if: steps.localtime.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtiff5-dev \
            libxml2-dev \
            libuv1-dev \
            pkg-config

      - name: Set up R
        if: steps.localtime.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install and verify R packages
        if: steps.localtime.outputs.should_run == 'true'
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          .libPaths(Sys.getenv("R_LIBS_USER"))

          packages <- c("dplyr", "ffscrapr", "googlesheets4", "httr", "jsonlite", "lubridate", "nflreadr", "purrr", "readr", "stringr", "tibble")
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]

          if (length(missing) > 0) {
            install.packages(
              missing,
              repos = "https://cloud.r-project.org",
              dependencies = c("Depends", "Imports", "LinkingTo"),
              Ncpus = max(1, parallel::detectCores() - 1)
            )
          }

          still_missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(still_missing) > 0) {
            stop("R packages still not installed: ", paste(still_missing, collapse = ", "))
          }

          invisible(lapply(packages, requireNamespace, quietly = TRUE))
          sessionInfo()

      - name: Run salary cap accounting
        if: steps.localtime.outputs.should_run == 'true'
        env:
          CURRENT_SEASON: ${{ env.CURRENT_SEASON }}
          SNAPSHOT_WEEK: ${{ env.SNAPSHOT_WEEK }}
          RAW_CACHE_DIR: ${{ env.RAW_CACHE_DIR }}
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
          ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}
        run: Rscript scripts/run_cap_accounting.R

      - name: Update Contract Admin Cap Rollover tab
        if: steps.localtime.outputs.should_run == 'true' && env.GOOGLE_SERVICE_ACCOUNT_JSON_PRESENT == 'true'
        env:
          CURRENT_SEASON: ${{ env.CURRENT_SEASON }}
          SNAPSHOT_WEEK: ${{ env.SNAPSHOT_WEEK }}
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
          CONTRACT_ADMIN_SHEET_ID: 1Pyw8qVfiBlXNuX0lW0LdjRnBiijfbo2BXHfZMWwLLaw
          CONTRACT_ADMIN_CAP_ROLLOVER_TAB: Cap Rollover
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: Rscript scripts/push_cap_rollover_to_google_sheet.R

      - name: Skip Contract Admin writeback when Google credentials are missing
        if: steps.localtime.outputs.should_run == 'true' && env.GOOGLE_SERVICE_ACCOUNT_JSON_PRESENT != 'true'
        run: |
          echo "::warning::GOOGLE_SERVICE_ACCOUNT_JSON is not configured, so the Contract Admin Cap Rollover tab was not updated."

      - name: Build dashboard site
        if: steps.localtime.outputs.should_run == 'true'
        env:
          CURRENT_SEASON: ${{ env.CURRENT_SEASON }}
          RAW_CACHE_DIR: ${{ env.RAW_CACHE_DIR }}
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
        run: Rscript scripts/build_dashboard.R

      - name: Commit generated files
        if: steps.localtime.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Update weekly salary cap accounting"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          echo "Failed to push weekly salary cap accounting after 3 attempts."
          exit 1
