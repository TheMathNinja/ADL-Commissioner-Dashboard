name: Email weekly refresh completion
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify completion and preview without emailing
        type: boolean
        default: true
      league:
        description: Optional targeted league (requires process and recipient)
        type: string
        default: ''
      process:
        description: Optional targeted process (preliminary or corrections)
        type: string
        default: ''
      recipient_override:
        description: Optional targeted recipient
        type: string
        default: ''
      force_resend:
        description: Resend an already delivered targeted report
        type: boolean
        default: false
      force_gotw:
        description: Resend the current Game of the Week suggestion email
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: weekly-completion-email
  # A newer verifier sees at least as much publication state as an older one.
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Test report gating and recipient isolation
        run: |
          python3 -m unittest discover -s tests -p test_weekly_completion_email.py -v
          python3 -m unittest discover -s tests -p test_gotw_blurbs.py -v
          python3 -m unittest discover -s tests -p test_bonus_receipt.py -v
      - name: Verify live publication and email the owner
        env:
          GH_TOKEN: ${{ github.token }}
          WEEKLY_ORCHESTRATION_TOKEN: ${{ secrets.WEEKLY_ORCHESTRATION_TOKEN }}
          WEEKLY_REPORT_EMAIL_TO: ${{ secrets.WEEKLY_REPORT_EMAIL_TO }}
          ADL_WEEKLY_REPORT_EMAIL_TO: ${{ secrets.ADL_ALERT_EMAIL_TO }}
          FAFL_WEEKLY_REPORT_EMAIL_TO: ${{ secrets.WEEKLY_REPORT_EMAIL_TO }}
          ADL_ALERT_EMAIL_FROM: ${{ secrets.ADL_ALERT_EMAIL_FROM }}
          ADL_SMTP_SERVER: ${{ secrets.ADL_SMTP_SERVER }}
          ADL_SMTP_USERNAME: ${{ secrets.ADL_SMTP_USERNAME }}
          ADL_SMTP_PASSWORD: ${{ secrets.ADL_SMTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_LEAGUE: ${{ inputs.league }}
          TARGET_PROCESS: ${{ inputs.process }}
          RECIPIENT_OVERRIDE: ${{ inputs.recipient_override }}
          FORCE_RESEND: ${{ inputs.force_resend }}
          FORCE_GOTW: ${{ inputs.force_gotw }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ -n "$TARGET_LEAGUE" ]; then args+=(--league "$TARGET_LEAGUE"); fi
          if [ -n "$TARGET_PROCESS" ]; then args+=(--process "$TARGET_PROCESS"); fi
          if [ -n "$RECIPIENT_OVERRIDE" ]; then args+=(--recipient-override "$RECIPIENT_OVERRIDE"); fi
          if [ "$FORCE_RESEND" = true ]; then args+=(--force-resend); fi
          if [ "$FORCE_GOTW" = true ]; then args+=(--force-gotw); fi
          for attempt in $(seq 1 10); do
            set +e
            output="$(python3 scripts/email_weekly_completion.py "${args[@]}" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            if ! grep -q 'waiting for successful job, live site, or score corrections' <<<"$output"; then
              exit 0
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "::error::A completed weekly update was still not verifiable on the live site after ten checks."
              exit 1
            fi
            echo "Live publication is still converging; retrying in 60 seconds (attempt $attempt/10)."
            sleep 60
          done
