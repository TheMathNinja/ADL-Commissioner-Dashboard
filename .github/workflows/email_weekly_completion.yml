name: Email weekly refresh completion
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify completion and preview without emailing
        type: boolean
        default: true
      league:
        description: Optional targeted league (requires process and recipient)
        type: string
        default: ''
      process:
        description: Optional targeted process (preliminary or corrections)
        type: string
        default: ''
      recipient_override:
        description: Optional targeted recipient
        type: string
        default: ''
      force_resend:
        description: Resend an already delivered targeted report
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: weekly-completion-email
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TheMathNinja/ADL-GM-Dashboard
          ref: main
      - name: Test report gating and recipient isolation
        run: python3 -m unittest discover -s tests -p test_weekly_completion_email.py -v
      - name: Verify live publication and email the owner
        env:
          GH_TOKEN: ${{ github.token }}
          WEEKLY_ORCHESTRATION_TOKEN: ${{ secrets.WEEKLY_ORCHESTRATION_TOKEN }}
          WEEKLY_REPORT_EMAIL_TO: ${{ secrets.WEEKLY_REPORT_EMAIL_TO }}
          ADL_WEEKLY_REPORT_EMAIL_TO: ${{ secrets.ADL_ALERT_EMAIL_TO }}
          FAFL_WEEKLY_REPORT_EMAIL_TO: ${{ secrets.WEEKLY_REPORT_EMAIL_TO }}
          ADL_ALERT_EMAIL_FROM: ${{ secrets.ADL_ALERT_EMAIL_FROM }}
          ADL_SMTP_SERVER: ${{ secrets.ADL_SMTP_SERVER }}
          ADL_SMTP_USERNAME: ${{ secrets.ADL_SMTP_USERNAME }}
          ADL_SMTP_PASSWORD: ${{ secrets.ADL_SMTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_LEAGUE: ${{ inputs.league }}
          TARGET_PROCESS: ${{ inputs.process }}
          RECIPIENT_OVERRIDE: ${{ inputs.recipient_override }}
          FORCE_RESEND: ${{ inputs.force_resend }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ -n "$TARGET_LEAGUE" ]; then args+=(--league "$TARGET_LEAGUE"); fi
          if [ -n "$TARGET_PROCESS" ]; then args+=(--process "$TARGET_PROCESS"); fi
          if [ -n "$RECIPIENT_OVERRIDE" ]; then args+=(--recipient-override "$RECIPIENT_OVERRIDE"); fi
          if [ "$FORCE_RESEND" = true ]; then args+=(--force-resend); fi
          python3 scripts/email_weekly_completion.py "${args[@]}"
