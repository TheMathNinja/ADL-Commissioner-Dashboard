on:
  schedule:
    - cron: 5 */6 * 9-12,1 *
  workflow_dispatch:
    inputs:
      week:
        description: Optional ADL week to snapshot manually, before auto week detection begins.
        required: false
        type: string

name: lineup-designation-snapshots

permissions:
  contents: write

concurrency:
  group: commissioner-dashboard-data-writes
  cancel-in-progress: false

jobs:
  lineup-designation-snapshots:
    runs-on: ubuntu-latest
    env:
      CURRENT_SEASON: 2026
      ADL_RAW_LEAGUE_DATA_DIR: cache/raw_league_data
      R_LIBS_USER: ${{ github.workspace }}/_lib
      ADL_ALERT_FORCE_LIVE: true
      ADL_ALERT_WEEK: ${{ github.event.inputs.week }}
      ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
      MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
      MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
      MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}

    steps:
      - name: Checkout dashboard repo
        uses: actions/checkout@v4

      - name: Create cache directories
        run: |
          mkdir -p "${ADL_RAW_LEAGUE_DATA_DIR}"
          mkdir -p "${R_LIBS_USER}"
          mkdir -p data

      - name: Restore raw league data cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ADL_RAW_LEAGUE_DATA_DIR }}
          key: ${{ runner.os }}-commissioner-raw-league-data-${{ env.CURRENT_SEASON }}-${{ hashFiles('scripts/**/*.R', 'R/**/*.R') }}
          restore-keys: |
            ${{ runner.os }}-commissioner-raw-league-data-${{ env.CURRENT_SEASON }}-

      - name: Set up cached ADL R runtime
        uses: ./.github/actions/setup-adl-r

      - name: Capture designation snapshot
        run: Rscript scripts/run_commissioner_alerts.R --mode=snapshot --season=${CURRENT_SEASON} --force-live

      - name: Commit designation snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/commissioner_alerts/designation_snapshots
          git add -A data/commissioner_alerts
          git diff --cached --quiet && exit 0
          git commit -m "Automated lineup designation snapshot"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          echo "Failed to push designation snapshot after 3 attempts."
          exit 1
