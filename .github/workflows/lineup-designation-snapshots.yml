on:
  schedule:
    - cron: 5 */6 * 9-12,1 *
  workflow_dispatch:

name: lineup-designation-snapshots

permissions:
  contents: write

concurrency:
  group: commissioner-dashboard-data-writes
  cancel-in-progress: false

jobs:
  lineup-designation-snapshots:
    runs-on: ubuntu-latest
    env:
      CURRENT_SEASON: 2026
      ADL_RAW_LEAGUE_DATA_DIR: cache/raw_league_data
      R_LIBS_USER: ${{ github.workspace }}/_lib
      ADL_ALERT_FORCE_LIVE: true
      ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
      MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
      MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
      MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}

    steps:
      - name: Checkout dashboard repo
        uses: actions/checkout@v4

      - name: Create cache directories
        run: |
          mkdir -p "${ADL_RAW_LEAGUE_DATA_DIR}"
          mkdir -p "${R_LIBS_USER}"
          mkdir -p data

      - name: Restore raw league data cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ADL_RAW_LEAGUE_DATA_DIR }}
          key: ${{ runner.os }}-commissioner-raw-league-data-${{ env.CURRENT_SEASON }}-${{ hashFiles('scripts/**/*.R', 'R/**/*.R') }}
          restore-keys: |
            ${{ runner.os }}-commissioner-raw-league-data-${{ env.CURRENT_SEASON }}-

      - name: Restore R package library cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-lineup-designation-r-lib-v1-${{ hashFiles('.github/workflows/lineup-designation-snapshots.yml', 'DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-lineup-designation-r-lib-v1-

      - name: Install Ubuntu system libraries and R
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            r-base \
            r-base-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtiff5-dev \
            libxml2-dev \
            libuv1-dev \
            pkg-config

      - name: Install and verify R packages
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          .libPaths(Sys.getenv("R_LIBS_USER"))
          options(repos = c(
            ffverse = "https://ffverse.r-universe.dev",
            CRAN = "https://cloud.r-project.org"
          ))

          packages <- c("dplyr", "ffscrapr", "lubridate", "readr", "stringr", "tibble")
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]

          if (length(missing) > 0) {
            install.packages(
              missing,
              dependencies = c("Depends", "Imports", "LinkingTo"),
              Ncpus = max(1, parallel::detectCores() - 1)
            )
          }

          still_missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(still_missing) > 0) {
            stop("R packages still not installed: ", paste(still_missing, collapse = ", "))
          }

      - name: Capture designation snapshot
        run: Rscript scripts/run_commissioner_alerts.R --mode=snapshot --season=${CURRENT_SEASON} --force-live

      - name: Commit designation snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/commissioner_alerts/designation_snapshots
          git add -A data/commissioner_alerts
          git diff --cached --quiet && exit 0
          git commit -m "Automated lineup designation snapshot"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          echo "Failed to push designation snapshot after 3 attempts."
          exit 1
