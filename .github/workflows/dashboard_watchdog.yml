name: Dashboard Watchdog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dashboard-freshness:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check today's maintenance result and alert ownership
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import re
          import sys
          import urllib.request
          sys.path.insert(0, 'scripts')
          from maintenance_failure_links import covered_components
          from datetime import datetime, time, timezone
          from zoneinfo import ZoneInfo

          et = ZoneInfo("America/New_York")
          now_et = datetime.now(timezone.utc).astimezone(et)
          window_start = datetime.combine(now_et.date(), time(5, 0), tzinfo=et)
          headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "User-Agent": "ADL-dashboard-watchdog",
                  "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          runs = github_json(
              "https://api.github.com/repos/TheMathNinja/ADL-GM-Dashboard/"
              "actions/workflows/daily_adl_league_maintenance.yml/runs?per_page=20"
          ).get("workflow_runs", [])

          todays_runs = []
          for run in runs:
              created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00")).astimezone(et)
              if created >= window_start and run.get("display_title") == "Daily ADL League Maintenance" and run.get("head_branch") == "main":
                  todays_runs.append((created, run))

          if not todays_runs:
              sys.exit(
                  "Daily ADL League Maintenance was not dispatched after "
                  f"{window_start:%b %d, %Y at %I:%M %p %Z}."
              )

          created, run = max(todays_runs, key=lambda item: item[0])
          if run.get("status") != "completed":
              sys.exit(
                  "Today's daily maintenance package is still running: " + run["html_url"]
              )

          jobs = github_json(run["jobs_url"] + "?per_page=100").get("jobs", [])
          reuse = [re.fullmatch(r'Reuse verified daily maintenance run (\d+)', j['name'])
                   for j in jobs if j.get('conclusion')=='success']
          reuse = [m[1] for m in reuse if m]
          if reuse:
              if len(reuse)!=1 or run.get('conclusion')!='success':
                  sys.exit('Invalid daily maintenance reuse evidence.')
              original = github_json("https://api.github.com/repos/TheMathNinja/ADL-GM-Dashboard/actions/runs/"+reuse[0])
              original_time=datetime.fromisoformat(original['created_at'].replace('Z','+00:00')).astimezone(et)
              if not (window_start<=original_time<=created and original['workflow_id']==run['workflow_id']
                      and original['head_branch']=='main' and original['conclusion']=='success'):
                  sys.exit('Daily maintenance source is not a verified same-day publication.')
              original_jobs=github_json(original['jobs_url']+'?per_page=100')['jobs']
              intents=lambda items:{j['name'] for j in items if j['name'].startswith('Daily intent v1 ') and j['conclusion']=='success'}
              if len(intents(jobs))!=1 or intents(jobs)!=intents(original_jobs):
                  sys.exit('Daily maintenance source intent does not match.')
              run,jobs,created=original,original_jobs,original_time
          jobs_by_name = {job["name"]: job for job in jobs}
          required_jobs = (
              "Refresh SalAdj and Commissioner data",
              "Apply waiver cap corrections",
              "Refresh rosters, EXT and Salary Cap Manager / refresh",
              "Run Commissioner alerts",
          )
          missing = [name for name in required_jobs if name not in jobs_by_name]
          if missing:
              sys.exit("Daily maintenance is missing required jobs: " + ", ".join(missing))

          recovery_specs = {
              "Refresh SalAdj and Commissioner data": ("update_dashboard.yml", "Commissioner data"),
              "Apply waiver cap corrections": ("waiver-cap-corrections.yml", "Waiver corrections"),
              "Run Commissioner alerts": ("daily-commissioner-alerts.yml", "Commissioner alerts"),
          }
          unresolved = []
          recovered = {}
          for name in required_jobs:
              if jobs_by_name[name].get("conclusion") == "success":
                  continue
              if name not in recovery_specs:
                  unresolved.append(name)
                  continue

              workflow, title_suffix = recovery_specs[name]
              recovery_runs = github_json(
                  "https://api.github.com/repos/TheMathNinja/ADL-Commissioner-Dashboard/"
                  f"actions/workflows/{workflow}/runs?per_page=50"
              ).get("workflow_runs", [])
              expected_titles = {
                  f"Daily maintenance {run['id']} - {title_suffix}",
                  f"Daily maintenance recovery-{run['id']} - {title_suffix}",
              }
              recoveries = [
                  candidate for candidate in recovery_runs
                  if candidate.get("display_title") in expected_titles
                  and candidate.get("conclusion") == "success"
                  and candidate.get("created_at", "") >= run.get("created_at", "")
              ]
              if recoveries:
                  recovery = max(recoveries, key=lambda candidate: candidate["created_at"])
                  recovered[name] = recovery["html_url"]
              else:
                  unresolved.append(name)

          if unresolved:
              details = ", ".join(
                  f"{name}={jobs_by_name[name].get('conclusion') or jobs_by_name[name].get('status')}"
                  for name in unresolved
              )
              # Only coalesce failures with evidence that this exact parent's
              # component was already reported. Missing runs and receipts still fail.
              state_file = "data/workflow_failure_email_state.json"
              with open(state_file, encoding="utf8") as handle:
                  notices = json.load(handle)
              print('MAINTENANCE_FAILURE_EVIDENCE=' + json.dumps({
                  'parent': str(run['id']), 'attempt': run.get('run_attempt', 1),
                  'unresolved': {name: jobs_by_name[name].get('conclusion') for name in unresolved}
              }), flush=True)
              covered = covered_components(notices, run, jobs)
              if not set(unresolved) <= covered:
                  sys.exit("Today's daily maintenance has unresolved component failures: " + details)
              print("Unresolved but already reported by daily maintenance:", details, run["html_url"])
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
                  summary.write(f"Maintenance remains incomplete: {details}. [Already reported parent]({run['html_url']}).\n")

          if not unresolved:
              print(f"Daily maintenance components verified: {created:%b %d, %Y %I:%M:%S %p %Z}")
          print(run["html_url"])
          for name, recovery_url in recovered.items():
              print(f"{name} recovered successfully:")
              print(recovery_url)

      - name: Verify SalAdjCurator checked in recently
        if: always() && !cancelled()
        shell: python
        run: |
          import csv
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          metadata_path = Path("data/run_metadata.csv")
          max_age_hours = 28

          if not metadata_path.exists():
              sys.exit("data/run_metadata.csv is missing; dashboard freshness cannot be verified.")

          with metadata_path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          if not rows:
              sys.exit("data/run_metadata.csv has no rows; dashboard freshness cannot be verified.")

          last_checked = (rows[0].get("last_checked_display") or "").strip()
          if not last_checked:
              sys.exit("last_checked_display is blank in data/run_metadata.csv.")

          match = re.fullmatch(
              r"(\d{1,2})/(\d{1,2})/(\d{4}) (\d{1,2}):(\d{2}) (a\.m\.|p\.m\.) (EDT|EST)",
              last_checked,
          )
          if not match:
              sys.exit(f"Could not parse last_checked_display: {last_checked!r}")

          month, day, year, hour, minute, meridiem, _abbr = match.groups()
          hour = int(hour)
          if meridiem == "a.m.":
              hour = 0 if hour == 12 else hour
          else:
              hour = 12 if hour == 12 else hour + 12

          checked_at = datetime(
              int(year),
              int(month),
              int(day),
              hour,
              int(minute),
              tzinfo=ZoneInfo("America/New_York"),
          )
          now = datetime.now(timezone.utc)
          age_hours = (now - checked_at.astimezone(timezone.utc)).total_seconds() / 3600

          print(f"Last checked: {last_checked}")
          print(f"Age: {age_hours:.2f} hours")

          if age_hours > max_age_hours:
              sys.exit(
                  f"SalAdjCurator is stale: last checked {age_hours:.2f} hours ago, "
                  f"which exceeds the {max_age_hours}-hour watchdog threshold."
              )
