name: Dashboard Watchdog

on:
  workflow_dispatch:
  schedule:
    # Independent 6:57 a.m. ET fallback. Apps Script remains the primary
    # dispatcher; these two UTC candidates cover daylight-saving changes.
    - cron: '57 10 * * *'
    - cron: '57 11 * * *'

permissions:
  contents: read

jobs:
  check-dashboard-freshness:
    runs-on: ubuntu-latest

    steps:
      - name: Select 6:57 a.m. Eastern fallback slot
        id: timing
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OFFSET=$(TZ=America/New_York date +%z)
          SLOT="${{ github.event.schedule }}"
          if { [ "$OFFSET" = "-0400" ] && [ "$SLOT" = "57 10 * * *" ]; } || \
             { [ "$OFFSET" = "-0500" ] && [ "$SLOT" = "57 11 * * *" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.timing.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Verify today's daily maintenance package completed
        if: steps.timing.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime, time, timezone
          from zoneinfo import ZoneInfo

          et = ZoneInfo("America/New_York")
          now_et = datetime.now(timezone.utc).astimezone(et)
          window_start = datetime.combine(now_et.date(), time(5, 0), tzinfo=et)
          url = (
              "https://api.github.com/repos/TheMathNinja/ADL-GM-Dashboard/"
              "actions/workflows/daily_adl_league_maintenance.yml/runs?per_page=20"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "User-Agent": "ADL-dashboard-watchdog",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get("workflow_runs", [])

          todays_runs = []
          for run in runs:
              created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00")).astimezone(et)
              if created >= window_start:
                  todays_runs.append((created, run))

          if not todays_runs:
              sys.exit(
                  "Daily ADL League Maintenance was not dispatched after "
                  f"{window_start:%b %d, %Y at %I:%M %p %Z}."
              )

          successful = [item for item in todays_runs if item[1].get("conclusion") == "success"]
          if not successful:
              summary = ", ".join(
                  f"{created:%I:%M %p} {run.get('status')}/{run.get('conclusion') or 'pending'}"
                  for created, run in todays_runs
              )
              sys.exit("Today's daily maintenance package has no successful run: " + summary)

          created, run = max(successful, key=lambda item: item[0])
          print(f"Daily maintenance verified: {created:%b %d, %Y %I:%M:%S %p %Z}")
          print(run["html_url"])

      - name: Verify SalAdjCurator checked in recently
        if: steps.timing.outputs.should_run == 'true'
        shell: python
        run: |
          import csv
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          metadata_path = Path("data/run_metadata.csv")
          max_age_hours = 28

          if not metadata_path.exists():
              sys.exit("data/run_metadata.csv is missing; dashboard freshness cannot be verified.")

          with metadata_path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          if not rows:
              sys.exit("data/run_metadata.csv has no rows; dashboard freshness cannot be verified.")

          last_checked = (rows[0].get("last_checked_display") or "").strip()
          if not last_checked:
              sys.exit("last_checked_display is blank in data/run_metadata.csv.")

          match = re.fullmatch(
              r"(\d{1,2})/(\d{1,2})/(\d{4}) (\d{1,2}):(\d{2}) (a\.m\.|p\.m\.) (EDT|EST)",
              last_checked,
          )
          if not match:
              sys.exit(f"Could not parse last_checked_display: {last_checked!r}")

          month, day, year, hour, minute, meridiem, _abbr = match.groups()
          hour = int(hour)
          if meridiem == "a.m.":
              hour = 0 if hour == 12 else hour
          else:
              hour = 12 if hour == 12 else hour + 12

          checked_at = datetime(
              int(year),
              int(month),
              int(day),
              hour,
              int(minute),
              tzinfo=ZoneInfo("America/New_York"),
          )
          now = datetime.now(timezone.utc)
          age_hours = (now - checked_at.astimezone(timezone.utc)).total_seconds() / 3600

          print(f"Last checked: {last_checked}")
          print(f"Age: {age_hours:.2f} hours")

          if age_hours > max_age_hours:
              sys.exit(
                  f"SalAdjCurator is stale: last checked {age_hours:.2f} hours ago, "
                  f"which exceeds the {max_age_hours}-hour watchdog threshold."
              )
