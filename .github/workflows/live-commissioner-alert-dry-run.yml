on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Email address that receives all dry-run messages.
        required: true
        default: fili.mikey@gmail.com
        type: string
      mode:
        description: Rule mode to run.
        required: true
        default: check
        type: choice
        options:
          - check
          - offseason
          - inseason
      week:
        description: Optional week for in-season lineup checks.
        required: false
        default: ""
        type: string
      gm_count:
        description: Number of GM-style dry-run emails to send to the recipient.
        required: true
        default: "2"
        type: string

name: live-commissioner-alert-dry-run

permissions:
  contents: read

jobs:
  live-commissioner-alert-dry-run:
    runs-on: ubuntu-latest
    env:
      CURRENT_SEASON: 2026
      ADL_RAW_LEAGUE_DATA_DIR: cache/raw_league_data
      ADL_CAP_ACCOUNTING_DIR: data/cap_accounting
      R_LIBS_USER: ${{ github.workspace }}/_lib
      ADL_ALERT_TEST_TO: ${{ github.event.inputs.recipient }}
      ADL_ALERT_MODE: ${{ github.event.inputs.mode }}
      ADL_ALERT_WEEK: ${{ github.event.inputs.week }}
      ADL_ALERT_TEST_GM_COUNT: ${{ github.event.inputs.gm_count }}
      ADL_ALERT_FORCE_LIVE: true
      ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
      MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
      MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
      MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}
      ADL_ALERT_EMAIL_FROM: ${{ secrets.ADL_ALERT_EMAIL_FROM }}
      ADL_SMTP_SERVER: ${{ secrets.ADL_SMTP_SERVER }}
      ADL_SMTP_USERNAME: ${{ secrets.ADL_SMTP_USERNAME }}
      ADL_SMTP_PASSWORD: ${{ secrets.ADL_SMTP_PASSWORD }}
      ADL_SMTP_SSL: ${{ secrets.ADL_SMTP_SSL }}

    steps:
      - name: Checkout dashboard repo
        uses: actions/checkout@v4

      - name: Create cache directories
        run: |
          mkdir -p "${ADL_RAW_LEAGUE_DATA_DIR}"
          mkdir -p "${R_LIBS_USER}"
          mkdir -p data

      - name: Restore raw league data cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ADL_RAW_LEAGUE_DATA_DIR }}
          key: ${{ runner.os }}-commissioner-raw-league-data-${{ env.CURRENT_SEASON }}-${{ hashFiles('scripts/**/*.R', 'R/**/*.R') }}
          restore-keys: |
            ${{ runner.os }}-commissioner-raw-league-data-${{ env.CURRENT_SEASON }}-

      - name: Restore R package library cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-commissioner-alert-live-dry-run-r-lib-v1-${{ hashFiles('.github/workflows/live-commissioner-alert-dry-run.yml', 'DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-commissioner-alert-live-dry-run-r-lib-v1-
            ${{ runner.os }}-commissioner-alert-r-lib-v1-

      - name: Install Ubuntu system libraries and R
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            r-base \
            r-base-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtiff5-dev \
            libxml2-dev \
            libuv1-dev \
            pkg-config

      - name: Install and verify R packages
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          .libPaths(Sys.getenv("R_LIBS_USER"))
          options(repos = c(
            ffverse = "https://ffverse.r-universe.dev",
            CRAN = "https://cloud.r-project.org"
          ))

          packages <- c("curl", "dplyr", "ffscrapr", "httr", "jsonlite", "lubridate", "nflreadr", "readr", "rvest", "stringr", "tibble")
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing) > 0) {
            install.packages(missing, dependencies = c("Depends", "Imports", "LinkingTo"), Ncpus = max(1, parallel::detectCores() - 1))
          }

          still_missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(still_missing) > 0) stop("R packages still not installed: ", paste(still_missing, collapse = ", "))

      - name: Send live commissioner alert dry run
        run: |
          WEEK_ARG=""
          if [ -n "${ADL_ALERT_WEEK}" ]; then
            WEEK_ARG="--week=${ADL_ALERT_WEEK}"
          fi

          Rscript scripts/send_live_commissioner_alert_dry_run.R \
            --season=${CURRENT_SEASON} \
            --mode="${ADL_ALERT_MODE}" \
            ${WEEK_ARG} \
            --gm-count="${ADL_ALERT_TEST_GM_COUNT}" \
            --to="${ADL_ALERT_TEST_TO}" \
            --force-live \
            --send-empty

      - name: Upload live dry-run outboxes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-commissioner-alert-dry-run-outboxes
          path: data/commissioner_alerts/
